model:
  input_dim: 32
  vocab_size: 256
  embed_dim: 32
  hidden_dim: 64
  proj_dim: 32
  num_codes: 32
  num_actions: 8
  num_rubric: 4
  num_layers: 1
  num_heads: 4
  dropout: 0.1
  momentum: 0.996
  temperature: 0.07
  max_steps: 3
  memory_size: 64
  use_quantizer: true
  use_memory: true
  use_planner: true
  use_target: true

train:
  steps: 200
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  task: mixed
  seed: 7
  amp: false
  device: cpu
  eval_every: 50
  save_every: 100
  early_stop_patience: 0
