name: Frozen supplement source identity

on:
  pull_request:
    paths:
      - 'scripts/paper/verify_frozen_supplement.py'
      - 'tests/test_frozen_supplement_source.py'
      - 'research/verification/frozen_supplement_source_20261010/**'
      - '.github/workflows/frozen-supplement-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-identity-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the exact reviewed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install the test runner
        run: python -m pip install pytest==9.1.1
      - name: Run source-only and existing release-boundary regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-verification-evidence
          python -m pytest -q -W error \
            tests/test_frozen_supplement_source.py \
            tests/test_release_artifact_boundary.py \
            tests/test_research_claim_boundary.py \
            --junitxml=source-verification-evidence/tests.xml \
            2>&1 | tee source-verification-evidence/tests.txt
      - name: Preserve source-verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frozen-source-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: source-verification-evidence
          if-no-files-found: warn
          retention-days: 14
