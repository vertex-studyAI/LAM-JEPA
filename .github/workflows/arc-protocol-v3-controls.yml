name: ARC Protocol V3 Controls

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arc-protocol-v3-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install CPU research environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[external-benchmarks]'

      - name: Compile ARC protocol-v3 control code
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/benchmark/run_arc_protocol_v3_controls.py \
            scripts/ci/verify_arc_protocol_v3_controls.py \
            scripts/ci/verify_arc_protocol_v3.py

      - name: Verify frozen ARC protocol v3
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          python scripts/ci/verify_arc_protocol_v3.py \
            --protocol protocols/arc_challenge_v3.json \
            --dataset-manifest data/manifests/arc_challenge.json \
            --report ci-evidence/arc-protocol-v3-verification.json

      - name: Download checksum-addressed ARC train and validation only
        run: |
          set -euo pipefail
          python scripts/data/download_arc_challenge.py \
            --splits train validation \
            --out-dir ci-evidence/arc-data \
            | tee ci-evidence/arc-download-controls-v3.json
          test ! -e ci-evidence/arc-data/arc-challenge-test.parquet

      - name: Run eligible required ablations and negative control
        run: |
          set -euo pipefail
          python scripts/benchmark/run_arc_protocol_v3_controls.py \
            --train ci-evidence/arc-data/arc-challenge-train.parquet \
            --validation ci-evidence/arc-data/arc-challenge-validation.parquet \
            --seeds 1 2 \
            --epochs 1 \
            --batch-size 4 \
            --learning-rate 0.0003 \
            --model-steps 1 \
            --train-limit 32 \
            --validation-limit 64 \
            --device cpu \
            --out ci-evidence/arc-protocol-v3-controls.json \
            | tee ci-evidence/arc-protocol-v3-controls-output.txt

      - name: Independently verify eligible real-ARC controls
        run: |
          set -euo pipefail
          python scripts/ci/verify_arc_protocol_v3_controls.py \
            --results ci-evidence/arc-protocol-v3-controls.json \
            --protocol protocols/arc_challenge_v3.json \
            --train ci-evidence/arc-data/arc-challenge-train.parquet \
            --validation ci-evidence/arc-data/arc-challenge-validation.parquet \
            --report ci-evidence/arc-protocol-v3-controls-verification.json \
            | tee ci-evidence/arc-protocol-v3-controls-verifier-output.txt

      - name: Upload ARC protocol-v3 controls evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arc-protocol-v3-controls-smoke
          path: ci-evidence
          if-no-files-found: warn
          retention-days: 14
