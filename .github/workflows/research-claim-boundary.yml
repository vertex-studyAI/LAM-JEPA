name: Research claim boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  claim-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Unit test claim guard
        run: python -m unittest tests.test_research_claim_boundary
      - name: Verify repository research boundary
        run: |
          python scripts/ci/verify_research_claim_boundary.py \
            --status RESEARCH_STATUS.md \
            --readme README.md \
            --out artifacts/research-claim-boundary.json
      - name: Upload claim-boundary evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-claim-boundary
          path: artifacts/research-claim-boundary.json
          retention-days: 7
