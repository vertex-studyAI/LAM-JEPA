name: Research claim boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  claim-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Unit test claim guard
        run: python -m unittest tests.test_research_claim_boundary
      - name: Verify repository research boundary
        run: |
          python scripts/ci/verify_research_claim_boundary.py \
            --status RESEARCH_STATUS.md \
            --readme README.md \
            --out artifacts/research-claim-boundary.json
      - name: Upload claim-boundary evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-claim-boundary
          path: artifacts/research-claim-boundary.json
          retention-days: 7
