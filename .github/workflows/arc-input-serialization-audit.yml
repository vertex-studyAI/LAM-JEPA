name: ARC Canonical Input Visibility Audit

on:
  pull_request:
    paths:
      - "src/lam_jepa/benchmarking/arc_challenge.py"
      - "src/lam_jepa/data.py"
      - "src/lam_jepa/benchmarking/arc_protocol.py"
      - "scripts/data/audit_arc_input_serialization.py"
      - "scripts/ci/verify_arc_input_serialization_audit.py"
      - ".github/workflows/arc-input-serialization-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arc-input-visibility-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install CPU environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[external-benchmarks]'
          python -m pip check
      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          printf 'source_commit=%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > ci-evidence/environment.txt
          printf 'workflow_commit=%s\n' "$GITHUB_SHA" >> ci-evidence/environment.txt
          printf 'runner_image=ubuntu-24.04\n' >> ci-evidence/environment.txt
          python --version >> ci-evidence/environment.txt
          python -m pip --version >> ci-evidence/environment.txt
          python -m pip freeze --all >> ci-evidence/environment.txt
      - name: Compile audit
        run: |
          python -m py_compile scripts/data/audit_arc_input_serialization.py scripts/ci/verify_arc_input_serialization_audit.py
      - name: Download checksum-addressed ARC train and validation only
        run: |
          mkdir -p ci-evidence
          python scripts/data/download_arc_challenge.py --splits train validation --out-dir ci-evidence/arc-data | tee ci-evidence/download.json
          test ! -e ci-evidence/arc-data/arc-challenge-test.parquet
      - name: Audit canonical prompt visibility
        run: |
          python scripts/data/audit_arc_input_serialization.py \
            --train ci-evidence/arc-data/arc-challenge-train.parquet \
            --validation ci-evidence/arc-data/arc-challenge-validation.parquet \
            --out ci-evidence/input-visibility-audit.json \
            | tee ci-evidence/input-visibility-output.txt
      - name: Independently verify audit structure
        run: |
          python scripts/ci/verify_arc_input_serialization_audit.py \
            --audit ci-evidence/input-visibility-audit.json \
            --report ci-evidence/input-visibility-verification.json \
            | tee ci-evidence/input-visibility-verifier-output.txt
          test ! -e ci-evidence/arc-data/arc-challenge-test.parquet
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arc-canonical-input-visibility-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-evidence
          if-no-files-found: error
          retention-days: 30
