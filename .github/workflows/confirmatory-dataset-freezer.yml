name: Confirmatory Dataset Freezer

on:
  pull_request:
    paths:
      - 'tools/confirmatory_dataset_freezer.py'
      - 'tests/test_confirmatory_dataset_freezer.py'
      - 'protocols/confirmatory_dataset_manifest_template.json'
      - '.github/workflows/confirmatory-dataset-freezer.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/confirmatory_dataset_freezer.py'
      - 'tests/test_confirmatory_dataset_freezer.py'
      - 'protocols/confirmatory_dataset_manifest_template.json'
      - '.github/workflows/confirmatory-dataset-freezer.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Run confirmatory dataset freezer regression tests
        run: python -m unittest tests.test_confirmatory_dataset_freezer -v
      - name: Prove repository template is deliberately non-freezable
        shell: bash
        run: |
          set -euo pipefail
          if python tools/confirmatory_dataset_freezer.py \
              --manifest protocols/confirmatory_dataset_manifest_template.json; then
            echo 'Draft template unexpectedly passed the freeze gate.' >&2
            exit 1
          fi
