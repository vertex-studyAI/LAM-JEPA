name: Reproducibility CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lam-jepa-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-training-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU research environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[external-benchmarks]'

      - name: Confirm CPU-only execution
        run: |
          python -c 'import torch; assert not torch.cuda.is_available(), "reproducibility gate must remain CPU-only"; print({"torch": torch.__version__, "cuda_available": torch.cuda.is_available()})'

      - name: Compile source and scripts
        run: python -m compileall -q src scripts

      - name: Verify frozen ARC-Challenge scientific protocol
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          python scripts/ci/verify_arc_protocol.py \
            --protocol protocols/arc_challenge_v1.json \
            --dataset-manifest data/manifests/arc_challenge.json \
            --report ci-evidence/arc-protocol-verification.json

      - name: Download checksum-addressed ARC-Challenge train and validation only
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          python scripts/data/download_arc_challenge.py \
            --splits train validation \
            --out-dir ci-evidence/arc-data \
            | tee ci-evidence/arc-download.json
          test ! -e ci-evidence/arc-data/arc-challenge-test.parquet

      - name: Run externally grounded ARC-Challenge smoke
        run: |
          set -euo pipefail
          python scripts/benchmark/run_arc_challenge.py \
            --train ci-evidence/arc-data/arc-challenge-train.parquet \
            --validation ci-evidence/arc-data/arc-challenge-validation.parquet \
            --seeds 1 2 \
            --epochs 1 \
            --batch-size 4 \
            --model-steps 1 \
            --train-limit 16 \
            --validation-limit 16 \
            --device cpu \
            --out ci-evidence/arc-challenge-smoke.json \
            | tee ci-evidence/arc-challenge-output.txt

      - name: Verify ARC split, raw predictions, calibration, and claim boundaries
        run: |
          python scripts/ci/verify_arc_challenge_smoke.py \
            --results ci-evidence/arc-challenge-smoke.json \
            --report ci-evidence/arc-challenge-verification.json

      - name: Exercise documented multi-seed benchmark interface
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          python scripts/bench/run_benchmarks.py \
            --variant full \
            --steps 1 \
            --batch-size 2 \
            --eval-batches 1 \
            --evaluation-seed 17 \
            --device cpu \
            --seeds 1 2 \
            --out ci-evidence/benchmark-multiseed.json \
            | tee ci-evidence/benchmark-multiseed-output.txt

      - name: Verify paired multi-seed benchmark evidence
        run: |
          python scripts/ci/verify_benchmark_interface.py \
            --result ci-evidence/benchmark-multiseed.json \
            --expected-seeds 1 2 \
            --expected-evaluation-seed 17 \
            --report ci-evidence/benchmark-multiseed-verification.json

      - name: Run deterministic model training smoke
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          python scripts/train/train_single.py \
            --seed 1 \
            --steps 1 \
            --batch-size 2 \
            --task parity \
            --device cpu \
            --out-dir ci-evidence/checkpoints \
            --out ci-evidence/final.pt \
            | tee ci-evidence/train-output.txt

      - name: Verify canonical checkpoint evidence
        run: |
          python scripts/ci/verify_training_smoke.py \
            --checkpoint ci-evidence/final.pt \
            --report ci-evidence/training-verification.json

      - name: Evaluate every declared task
        run: |
          set -euo pipefail
          python scripts/eval/eval_all.py \
            --checkpoint ci-evidence/final.pt \
            --device cpu \
            --batch-size 2 \
            --batches 1 \
            --seed 1 \
            --out ci-evidence/eval-all.json \
            | tee ci-evidence/eval-output.txt

      - name: Verify all-task evaluation evidence
        run: |
          python scripts/ci/verify_evaluation_smoke.py \
            --evaluation ci-evidence/eval-all.json \
            --report ci-evidence/evaluation-verification.json

      - name: Measure matched label-distribution references
        run: |
          set -euo pipefail
          python scripts/eval/eval_baselines.py \
            --batch-size 2 \
            --batches 1 \
            --seed 1 \
            --out ci-evidence/eval-baselines.json \
            | tee ci-evidence/baseline-output.txt

      - name: Verify baseline metric identities and task coverage
        run: |
          python scripts/ci/verify_baseline_smoke.py \
            --evaluation ci-evidence/eval-baselines.json \
            --report ci-evidence/baseline-verification.json

      - name: Compare model accuracy with exact-row references
        run: |
          set -euo pipefail
          python scripts/analysis/compare_model_to_baselines.py \
            --model ci-evidence/eval-all.json \
            --baselines ci-evidence/eval-baselines.json \
            --out ci-evidence/model-baseline-comparison.json \
            | tee ci-evidence/model-baseline-comparison-output.txt

      - name: Verify exact pairing, deltas, and claim boundaries
        run: |
          python scripts/ci/verify_model_baseline_comparison.py \
            --model ci-evidence/eval-all.json \
            --baselines ci-evidence/eval-baselines.json \
            --comparison ci-evidence/model-baseline-comparison.json \
            --report ci-evidence/model-baseline-comparison-verification.json

      - name: Generate multi-seed paper-results package
        run: |
          set -euo pipefail
          python scripts/paper/generate_results.py \
            --out-dir ci-evidence/paper-results \
            --seeds 1 2 \
            --steps 1 \
            --batch-size 2 \
            --eval-batches 1 \
            --evaluation-seed 17 \
            --device cpu \
            --training-task parity \
            | tee ci-evidence/paper-results-output.txt

      - name: Verify paper-results package
        run: |
          python scripts/ci/verify_paper_results.py \
            --out-dir ci-evidence/paper-results \
            --report ci-evidence/paper-results-verification.json

      - name: Run paired multi-seed component ablations
        run: |
          set -euo pipefail
          python scripts/benchmark/run_ablations.py \
            --seeds 1 2 \
            --steps 1 \
            --batch-size 2 \
            --eval-batches 1 \
            --evaluation-seed 19 \
            --training-task parity \
            --device cpu \
            --out ci-evidence/ablation-results.json \
            | tee ci-evidence/ablation-output.txt

      - name: Verify paired ablation evidence
        run: |
          python scripts/ci/verify_ablation_smoke.py \
            --ablation ci-evidence/ablation-results.json \
            --report ci-evidence/ablation-verification.json

      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lam-jepa-training-evaluation-smoke
          path: ci-evidence
          if-no-files-found: warn
          retention-days: 7
