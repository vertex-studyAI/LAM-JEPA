name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lam-jepa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibility-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .

      - name: Confirm CPU-only execution
        run: |
          python - <<'PY'
          import torch

          assert not torch.cuda.is_available(), "reproducibility gate must remain CPU-only"
          print({"torch": torch.__version__, "cuda_available": torch.cuda.is_available()})
          PY

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run reproducibility tests
        run: python -m unittest discover -s tests -v
