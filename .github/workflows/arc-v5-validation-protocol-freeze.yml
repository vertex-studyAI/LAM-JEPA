name: ARC V5 Validation Protocol Freeze

on:
  pull_request:
    paths:
      - "protocols/arc_challenge_v5_repaired_validation.json"
      - "scripts/ci/verify_arc_v5_validation_protocol.py"
      - ".github/workflows/arc-v5-validation-protocol-freeze.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Verify frozen contract without acquiring ARC data
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          python scripts/ci/verify_arc_v5_validation_protocol.py \
            --protocol protocols/arc_challenge_v5_repaired_validation.json \
            --report ci-evidence/arc-v5-validation-protocol-freeze.json
          test ! -e ci-evidence/arc-data
      - name: Upload protocol freeze evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arc-v5-validation-protocol-freeze
          path: ci-evidence/arc-v5-validation-protocol-freeze.json
          if-no-files-found: warn
          retention-days: 30
