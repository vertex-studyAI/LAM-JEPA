name: AISTATS 2027 submission build

on:
  push:
    branches:
      - main
    paths:
      - 'paper/aistats2027_submission.tex'
      - 'paper/aistats2027_checklist.tex'
      - 'paper/aistats2027_complexity_section.tex'
      - 'paper/aistats2027.sty'
      - 'paper/references.bib'
      - 'publication/AISTATS2027_ABSTRACT_PACKET_2026-09-25.md'
      - '.github/workflows/aistats2027-submission.yml'
  pull_request:
    paths:
      - 'paper/aistats2027_submission.tex'
      - 'paper/aistats2027_checklist.tex'
      - 'paper/aistats2027_complexity_section.tex'
      - 'paper/aistats2027.sty'
      - 'paper/references.bib'
      - 'publication/AISTATS2027_ABSTRACT_PACKET_2026-09-25.md'
      - '.github/workflows/aistats2027-submission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Compile anonymous AISTATS candidate
        uses: xu-cheng/latex-action@v3
        with:
          root_file: aistats2027_submission.tex
          working_directory: paper
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Verify required paper surfaces
        working-directory: paper
        run: |
          test -s aistats2027_submission.pdf
          echo '33ab38f8aac4b2f1df9fe67e354928598200584e9568385f32deb889e1b81d42  aistats2027.sty' | sha256sum -c -
          grep -Fq '\ProvidesPackage{aistats2027}[2026/09/02 AISTATS2027 submission/camera-ready style file]' aistats2027.sty
          grep -Fq '\section*{AI Use Statement}' aistats2027_submission.tex
          grep -Fq '\input{aistats2027_checklist}' aistats2027_submission.tex
          test -s aistats2027_checklist.tex
          test -s aistats2027_complexity_section.tex
          grep -Fq '\input{aistats2027_complexity_section}' aistats2027_submission.tex
          grep -Fq '\section*{Checklist}' aistats2027_checklist.tex
          python - <<'PY'
          from pathlib import Path

          checklist = Path("aistats2027_checklist.tex").read_text(encoding="utf-8")
          malformed = r"\n    \\item"
          required = r"\item New assets either in the supplemental material or as a URL, if applicable."
          if malformed in checklist:
              raise SystemExit("AISTATS checklist contains a literal escaped newline/item sequence")
          if required not in checklist:
              raise SystemExit("AISTATS checklist is missing the New assets item")
          PY
          grep -Fq 'confirmatory ARC test remains locked' aistats2027_submission.tex
          grep -Fq 'the superiority gate therefore failed' aistats2027_submission.tex
          ! grep -Fq '760aa7f9a73a177d5ff4ba7eb470f7e68ace63cb' aistats2027_submission.tex
          ! grep -Fq '31203337502' aistats2027_submission.tex
          ! grep -Fq 'PR \#' aistats2027_submission.tex

      - name: Enforce final PDF submission gates
        working-directory: paper
        shell: bash
        run: |
          set -euo pipefail
          pages="$(pdfinfo aistats2027_submission.pdf | awk '/^Pages:/ {print $2}')"
          test -n "$pages"
          if [ "$pages" -gt 8 ]; then
            echo "AISTATS submission exceeds 8-page main-paper limit: $pages pages" >&2
            exit 1
          fi

          if grep -Eq 'LaTeX Warning: (Citation|Reference).*undefined|There were undefined references|There were undefined citations' aistats2027_submission.log; then
            echo 'Unresolved citation/reference warning found in AISTATS build log.' >&2
            exit 1
          fi

          if ! pdffonts aistats2027_submission.pdf | tail -n +3 | awk 'NF && $6 != "yes" {bad=1} END {exit bad}'; then
            echo 'At least one AISTATS PDF font is not embedded.' >&2
            pdffonts aistats2027_submission.pdf >&2
            exit 1
          fi

          pdftotext aistats2027_submission.pdf aistats2027_submission.txt
          if grep -Eqi 'Ryan Gomez|vertex-studyAI|build-the-future-11|Oakridge|@gmail\.com|@outlook\.com' aistats2027_submission.txt; then
            echo 'Potential author/repository identity leak found in rendered AISTATS PDF.' >&2
            exit 1
          fi

          {
            echo "source_commit=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "pages=${pages}"
            echo "pdf_sha256=$(sha256sum aistats2027_submission.pdf | awk '{print $1}')"
            echo "tex_sha256=$(sha256sum aistats2027_submission.tex | awk '{print $1}')"
            echo "style_sha256=$(sha256sum aistats2027.sty | awk '{print $1}')"
            echo "references_sha256=$(sha256sum references.bib | awk '{print $1}')"
            echo "scientific_verdict=negative/inconclusive"
            echo "confirmatory_test=locked/unopened"
          } | tee aistats2027_build_manifest.txt

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: lam-jepa-aistats2027-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            paper/aistats2027_submission.pdf
            paper/aistats2027_submission.tex
            paper/aistats2027_checklist.tex
            paper/aistats2027_complexity_section.tex
            paper/aistats2027.sty
            paper/references.bib
            paper/aistats2027_build_manifest.txt
            publication/AISTATS2027_ABSTRACT_PACKET_2026-09-25.md
