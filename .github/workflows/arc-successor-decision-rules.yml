name: ARC Successor Decision Rules

on:
  pull_request:
    branches: [main]
    paths:
      - "protocols/arc_successor_v1_draft.json"
      - "protocols/arc_successor_v1_draft.md"
      - "protocols/arc_successor_v1_decision_rules.json"
      - "protocols/confirmatory_dataset_candidates/openbookqa_v1_sep2018.json"
      - "tools/verify_arc_successor_decision_rules.py"
      - "tools/verify_confirmatory_dataset_candidate.py"
      - "tests/test_arc_successor_decision_rules.py"
      - "tests/test_confirmatory_dataset_candidate.py"
      - ".github/workflows/arc-successor-decision-rules.yml"
  push:
    branches: [main]
    paths:
      - "protocols/arc_successor_v1_draft.json"
      - "protocols/arc_successor_v1_draft.md"
      - "protocols/arc_successor_v1_decision_rules.json"
      - "protocols/confirmatory_dataset_candidates/openbookqa_v1_sep2018.json"
      - "tools/verify_arc_successor_decision_rules.py"
      - "tools/verify_confirmatory_dataset_candidate.py"
      - "tests/test_arc_successor_decision_rules.py"
      - "tests/test_confirmatory_dataset_candidate.py"
      - ".github/workflows/arc-successor-decision-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lam-jepa-successor-decision-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-preoutcome-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify decision-rule artifact and successor binding
        run: |
          set -euo pipefail
          python tools/verify_arc_successor_decision_rules.py \
            protocols/arc_successor_v1_decision_rules.json \
            protocols/arc_successor_v1_draft.json

      - name: Verify OpenBookQA candidate remains non-authorizing
        run: |
          set -euo pipefail
          python tools/verify_confirmatory_dataset_candidate.py \
            --candidate protocols/confirmatory_dataset_candidates/openbookqa_v1_sep2018.json \
            --successor protocols/arc_successor_v1_draft.json

      - name: Run fail-closed regressions
        run: |
          set -euo pipefail
          python tests/test_arc_successor_decision_rules.py

      - name: Record exact evidence
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          sha256sum protocols/arc_successor_v1_decision_rules.json > ci-evidence/decision-rules.sha256
          git rev-parse HEAD > ci-evidence/source-head.txt
          python tools/verify_arc_successor_decision_rules.py \
            protocols/arc_successor_v1_decision_rules.json \
            protocols/arc_successor_v1_draft.json \
            > ci-evidence/verification.txt

      - name: Upload decision-rule evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lam-jepa-successor-decision-rules-${{ github.sha }}
          path: ci-evidence
          if-no-files-found: warn
          retention-days: 14
