name: ARC Successor Development Split Freezer

on:
  pull_request:
    paths:
      - 'tools/successor_development_split_freezer.py'
      - 'tests/test_successor_development_split_freezer.py'
      - 'protocols/arc_successor_development_split_template.json'
      - '.github/workflows/arc-successor-development-split-freezer.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/successor_development_split_freezer.py'
      - 'tests/test_successor_development_split_freezer.py'
      - 'protocols/arc_successor_development_split_template.json'
      - '.github/workflows/arc-successor-development-split-freezer.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Run development split freezer regression tests
        run: python -m unittest tests.test_successor_development_split_freezer -v
      - name: Prove draft template is deliberately non-freezable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.successor_development_split_freezer import validate_config

          config = json.loads(Path('protocols/arc_successor_development_split_template.json').read_text())
          errors = validate_config(config)
          if not errors:
              raise SystemExit('draft development split template unexpectedly passed validation')
          print('\n'.join(errors))
          PY
