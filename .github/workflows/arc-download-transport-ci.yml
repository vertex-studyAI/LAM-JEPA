name: ARC Download Transport CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lam-jepa-arc-download-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checksum-pinned-download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Compile download code
        run: python -m compileall -q scripts/data tests/test_arc_download_retry.py

      - name: Verify bounded retry behavior
        run: python -m unittest discover -s tests -p 'test_arc_download_retry.py' -v

      - name: Download checksum-addressed ARC train and validation only
        run: |
          set -euo pipefail
          python scripts/data/download_arc_challenge.py \
            --splits train validation \
            --out-dir ci-evidence/arc-data \
            --download-attempts 4 \
            --download-timeout 60 \
            --download-backoff-seconds 2 \
            | tee ci-evidence-arc-download.json
          test ! -e ci-evidence/arc-data/arc-challenge-test.parquet
