name: ARC V5 Negative Result Analysis QA

on:
  pull_request:
    paths:
      - 'scripts/analysis/analyze_arc_v5_negative_result.py'
      - 'tests/test_arc_v5_negative_result_analysis.py'
      - 'docs/ARC_V5_NEGATIVE_RESULT_ANALYSIS.md'
      - '.github/workflows/arc-v5-negative-result-analysis.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/analysis/analyze_arc_v5_negative_result.py'
      - 'tests/test_arc_v5_negative_result_analysis.py'
      - 'docs/ARC_V5_NEGATIVE_RESULT_ANALYSIS.md'
      - '.github/workflows/arc-v5-negative-result-analysis.yml'

permissions:
  contents: read

jobs:
  verify-descriptive-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile analyzer and tests
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/analysis/analyze_arc_v5_negative_result.py \
            tests/test_arc_v5_negative_result_analysis.py
      - name: Run fail-closed analyzer tests
        run: |
          set -euo pipefail
          python -m unittest tests/test_arc_v5_negative_result_analysis.py -v
