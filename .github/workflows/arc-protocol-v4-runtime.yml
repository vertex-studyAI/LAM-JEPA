name: ARC Protocol V4 Runtime

on:
  pull_request:
    paths:
      - "protocols/arc_challenge_v4.json"
      - "scripts/data/materialize_arc_protocol_v3_eligible.py"
      - "scripts/benchmark/run_arc_pretrained_v4_deberta.py"
      - "scripts/ci/verify_arc_protocol_v4.py"
      - "scripts/ci/verify_arc_pretrained_v4_deberta.py"
      - ".github/workflows/arc-protocol-v4-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  arc-protocol-v4-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned hardened CPU environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[pretrained-baselines]'
          python - <<'PY'
          from packaging.version import Version
          import sentencepiece
          import torch
          import transformers
          assert transformers.__version__ == "4.57.6", transformers.__version__
          assert sentencepiece.__version__ == "0.2.2", sentencepiece.__version__
          assert Version(torch.__version__.split("+", 1)[0]) >= Version("2.6.0"), torch.__version__
          print({"torch": torch.__version__, "transformers": transformers.__version__, "sentencepiece": sentencepiece.__version__})
          PY

      - name: Compile v4 runtime code
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/data/materialize_arc_protocol_v3_eligible.py \
            scripts/benchmark/run_arc_pretrained_v2_deberta.py \
            scripts/benchmark/run_arc_pretrained_v4_deberta.py \
            scripts/ci/verify_arc_protocol_v3.py \
            scripts/ci/verify_arc_protocol_v3_eligibility.py \
            scripts/ci/verify_arc_pretrained_v2_deberta.py \
            scripts/ci/verify_arc_protocol_v4.py \
            scripts/ci/verify_arc_pretrained_v4_deberta.py

      - name: Verify canonical v3 and runtime-only v4 freeze
        run: |
          set -euo pipefail
          mkdir -p ci-evidence-v4
          python scripts/ci/verify_arc_protocol_v3.py \
            --protocol protocols/arc_challenge_v3.json \
            --dataset-manifest data/manifests/arc_challenge.json \
            --report ci-evidence-v4/arc-protocol-v3-verification.json
          python scripts/ci/verify_arc_protocol_v4.py \
            --protocol protocols/arc_challenge_v4.json \
            --report ci-evidence-v4/arc-protocol-v4-verification.json \
            | tee ci-evidence-v4/arc-protocol-v4-output.txt

      - name: Download checksum-addressed ARC train and validation only
        run: |
          set -euo pipefail
          python scripts/data/download_arc_challenge.py \
            --splits train validation \
            --out-dir ci-evidence-v4/arc-data \
            | tee ci-evidence-v4/arc-download.json
          test ! -e ci-evidence-v4/arc-data/arc-challenge-test.parquet

      - name: Independently audit canonical v3 eligibility
        run: |
          set -euo pipefail
          python scripts/data/audit_arc_protocol_v3_eligibility.py \
            --train ci-evidence-v4/arc-data/arc-challenge-train.parquet \
            --validation ci-evidence-v4/arc-data/arc-challenge-validation.parquet \
            --out ci-evidence-v4/arc-v3-eligibility-audit.json
          python scripts/ci/verify_arc_protocol_v3_eligibility.py \
            --audit ci-evidence-v4/arc-v3-eligibility-audit.json \
            --protocol protocols/arc_challenge_v3.json \
            --train ci-evidence-v4/arc-data/arc-challenge-train.parquet \
            --validation ci-evidence-v4/arc-data/arc-challenge-validation.parquet \
            --report ci-evidence-v4/arc-v3-eligibility-verification.json \
            | tee ci-evidence-v4/arc-v3-eligibility-verifier-output.txt
          test ! -e ci-evidence-v4/arc-data/arc-challenge-test.parquet

      - name: Materialize protocol-v3 eligible train and validation rows
        run: |
          set -euo pipefail
          mkdir -p ci-evidence-v4/arc-eligible
          python scripts/data/materialize_arc_protocol_v3_eligible.py \
            --input ci-evidence-v4/arc-data/arc-challenge-train.parquet \
            --output ci-evidence-v4/arc-eligible/arc-challenge-train-eligible.parquet \
            --split train \
            --report ci-evidence-v4/arc-train-materialization.json
          python scripts/data/materialize_arc_protocol_v3_eligible.py \
            --input ci-evidence-v4/arc-data/arc-challenge-validation.parquet \
            --output ci-evidence-v4/arc-eligible/arc-challenge-validation-eligible.parquet \
            --split validation \
            --report ci-evidence-v4/arc-validation-materialization.json
          python - <<'PY'
          import json
          from pathlib import Path
          train = json.loads(Path('ci-evidence-v4/arc-train-materialization.json').read_text())
          validation = json.loads(Path('ci-evidence-v4/arc-validation-materialization.json').read_text())
          assert (train['source_rows'], train['eligible_rows'], train['excluded_rows']) == (1119, 1117, 2), train
          assert (validation['source_rows'], validation['eligible_rows'], validation['excluded_rows']) == (299, 295, 4), validation
          assert train['test_split_accessed'] is False
          assert validation['test_split_accessed'] is False
          PY

      - name: Run bounded v4 DeBERTa smoke on eligible rows
        run: |
          set -euo pipefail
          python scripts/benchmark/run_arc_pretrained_v4_deberta.py \
            --train ci-evidence-v4/arc-eligible/arc-challenge-train-eligible.parquet \
            --validation ci-evidence-v4/arc-eligible/arc-challenge-validation-eligible.parquet \
            --seeds 1 2 \
            --epochs 1 \
            --batch-size 2 \
            --learning-rate 2e-5 \
            --max-length 96 \
            --max-train-steps 1 \
            --model-steps 1 \
            --train-limit 8 \
            --validation-limit 16 \
            --device cpu \
            --out ci-evidence-v4/arc-pretrained-v4-deberta.json \
            | tee ci-evidence-v4/arc-pretrained-v4-deberta-output.txt

      - name: Independently verify v4-bound DeBERTa evidence
        run: |
          set -euo pipefail
          python scripts/ci/verify_arc_pretrained_v4_deberta.py \
            --results ci-evidence-v4/arc-pretrained-v4-deberta.json \
            --protocol protocols/arc_challenge_v4.json \
            --report ci-evidence-v4/arc-pretrained-v4-deberta-verification.json \
            | tee ci-evidence-v4/arc-pretrained-v4-deberta-verifier-output.txt
          test ! -e ci-evidence-v4/arc-data/arc-challenge-test.parquet

      - name: Upload v4 runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arc-protocol-v4-runtime-smoke
          path: ci-evidence-v4
          if-no-files-found: warn
          retention-days: 14
