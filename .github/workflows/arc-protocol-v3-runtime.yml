name: ARC protocol v3 runtime gate

on:
  pull_request:
    paths:
      - "protocols/arc_challenge_v3.json"
      - "scripts/benchmark/run_arc_pretrained_v3_deberta.py"
      - "scripts/ci/verify_arc_protocol_v3.py"
      - "scripts/ci/verify_arc_pretrained_v3_deberta.py"
      - ".github/workflows/arc-protocol-v3-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  arc-protocol-v3-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned hardened CPU environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[pretrained-baselines]'
          python - <<'PY'
          from packaging.version import Version
          import sentencepiece
          import torch
          import transformers
          assert transformers.__version__ == "4.57.6", transformers.__version__
          assert sentencepiece.__version__ == "0.2.2", sentencepiece.__version__
          assert Version(torch.__version__.split("+", 1)[0]) >= Version("2.6.0"), torch.__version__
          print({"torch": torch.__version__, "transformers": transformers.__version__, "sentencepiece": sentencepiece.__version__})
          PY

      - name: Compile protocol-v3 code
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/benchmark/run_arc_pretrained_v2_deberta.py \
            scripts/benchmark/run_arc_pretrained_v3_deberta.py \
            scripts/ci/verify_arc_pretrained_v2_deberta.py \
            scripts/ci/verify_arc_protocol_v3.py \
            scripts/ci/verify_arc_pretrained_v3_deberta.py

      - name: Verify immutable v2 base and frozen v3 runtime addendum
        run: |
          set -euo pipefail
          mkdir -p ci-evidence-v3
          python scripts/ci/verify_arc_protocol_v3.py \
            --report ci-evidence-v3/arc-protocol-v3-verification.json \
            | tee ci-evidence-v3/arc-protocol-v3-output.txt

      - name: Download checksum-addressed ARC train and validation only
        run: |
          set -euo pipefail
          python scripts/data/download_arc_challenge.py \
            --splits train validation \
            --out-dir ci-evidence-v3/arc-data \
            | tee ci-evidence-v3/arc-download-v3.json
          test ! -e ci-evidence-v3/arc-data/arc-challenge-test.parquet

      - name: Run bounded protocol-v3 DeBERTa development smoke
        run: |
          set -euo pipefail
          python scripts/benchmark/run_arc_pretrained_v3_deberta.py \
            --train ci-evidence-v3/arc-data/arc-challenge-train.parquet \
            --validation ci-evidence-v3/arc-data/arc-challenge-validation.parquet \
            --seeds 1 2 \
            --epochs 1 \
            --batch-size 2 \
            --learning-rate 2e-5 \
            --max-length 96 \
            --max-train-steps 1 \
            --model-steps 1 \
            --train-limit 8 \
            --validation-limit 16 \
            --device cpu \
            --out ci-evidence-v3/arc-pretrained-v3-deberta.json \
            | tee ci-evidence-v3/arc-pretrained-v3-deberta-output.txt

      - name: Independently verify v3-bound DeBERTa evidence
        run: |
          set -euo pipefail
          python scripts/ci/verify_arc_pretrained_v3_deberta.py \
            --results ci-evidence-v3/arc-pretrained-v3-deberta.json \
            --protocol protocols/arc_challenge_v3.json \
            --report ci-evidence-v3/arc-pretrained-v3-deberta-verification.json \
            | tee ci-evidence-v3/arc-pretrained-v3-deberta-verifier-output.txt

      - name: Upload protocol-v3 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arc-protocol-v3-runtime-smoke
          path: ci-evidence-v3
          if-no-files-found: warn
          retention-days: 14
