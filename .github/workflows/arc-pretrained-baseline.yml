name: ARC pretrained baseline

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/benchmark/run_arc_pretrained_baseline.py"
      - "scripts/ci/verify_arc_pretrained_baseline.py"
      - "scripts/data/download_arc_challenge.py"
      - "data/manifests/arc_challenge.json"
      - "pyproject.toml"
      - ".github/workflows/arc-pretrained-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  arc-pretrained-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned CPU environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[pretrained-baselines]'
          python - <<'PY'
          import transformers
          assert transformers.__version__ == "4.57.6", transformers.__version__
          print(transformers.__version__)
          PY

      - name: Compile pretrained-baseline code
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/benchmark/run_arc_pretrained_baseline.py \
            scripts/ci/verify_arc_pretrained_baseline.py

      - name: Download checksum-addressed ARC train and validation only
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          python scripts/data/download_arc_challenge.py \
            --splits train validation \
            --out-dir ci-evidence/arc-data \
            | tee ci-evidence/arc-download-pretrained.json
          test ! -e ci-evidence/arc-data/arc-challenge-test.parquet

      - name: Run bounded immutable pretrained comparison
        run: |
          set -euo pipefail
          python scripts/benchmark/run_arc_pretrained_baseline.py \
            --train ci-evidence/arc-data/arc-challenge-train.parquet \
            --validation ci-evidence/arc-data/arc-challenge-validation.parquet \
            --seeds 1 2 \
            --epochs 1 \
            --batch-size 2 \
            --learning-rate 2e-5 \
            --max-length 96 \
            --max-train-steps 1 \
            --model-steps 1 \
            --train-limit 8 \
            --validation-limit 16 \
            --device cpu \
            --out ci-evidence/arc-pretrained-baseline.json \
            | tee ci-evidence/arc-pretrained-baseline-output.txt

      - name: Independently verify pretrained evidence
        run: |
          set -euo pipefail
          python scripts/ci/verify_arc_pretrained_baseline.py \
            --results ci-evidence/arc-pretrained-baseline.json \
            --report ci-evidence/arc-pretrained-baseline-verification.json \
            | tee ci-evidence/arc-pretrained-baseline-verifier-output.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arc-pretrained-baseline-smoke
          path: ci-evidence
          if-no-files-found: warn
          retention-days: 14
